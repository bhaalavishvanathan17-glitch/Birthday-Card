<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fff" />
  <rect x="20" y="20" width="760" height="560" rx="20" fill="url(#grad4)" opacity="0.08" />
  <g filter="url(#shadow)" transform="translate(400, 260)">
    <!-- Infinity loop combined with heart -->
    <path d="M -120,0 C -120,-60 -60,-60 0,0 C 60,60 120,60 120,0 C 120,-60 60,-60 0,0 C -60,60 -120,60 -120,0 Z" fill="none" stroke="url(#grad4)" stroke-width="24" stroke-linecap="round" />
    <path d="M 0,-40 C -15,-65 -45,-65 -60,-45 C -75,-25 -60,15 0,60 C 60,15 75,-25 60,-45 C 45,-65 15,-65 0,-40 Z" fill="#db2777" opacity="0.4" />
    <!-- Sparkles -->
    <circle cx="-130" cy="-60" r="6" fill="#fbcfe8" />
    <circle cx="130" cy="60" r="4" fill="#fbcfe8" />
    <circle cx="0" cy="-100" r="8" fill="#fbcfe8" />
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="#701a75">Today & Beyond 🌌</text>
  <text x="400" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#c084fc" opacity="0.7">To infinity and forever with you.</text>
</svg>
