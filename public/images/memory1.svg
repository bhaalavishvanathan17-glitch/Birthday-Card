<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fff" />
  <rect x="20" y="20" width="760" height="560" rx="20" fill="url(#grad1)" opacity="0.08" />
  <g filter="url(#shadow)" transform="translate(400, 260)">
    <!-- Big Heart -->
    <path d="M 0,-80 C -80,-180 -200,-100 -200,20 C -200,120 -80,200 0,280 C 80,200 200,120 200,20 C 200,-100 80,-180 0,-80 Z" fill="url(#grad1)" />
    <!-- Heart Glow/Sparkle -->
    <circle cx="-50" cy="-30" r="10" fill="#fff" opacity="0.3" />
    <circle cx="80" cy="-60" r="5" fill="#fff" opacity="0.4" />
  </g>
  <!-- Cute Text -->
  <text x="400" y="520" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="#be123c">The Beginning ❤️</text>
  <text x="400" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#e11d48" opacity="0.7">Our first beautiful connection.</text>
</svg>
