<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fff" />
  <rect x="20" y="20" width="760" height="560" rx="20" fill="url(#grad3)" opacity="0.08" />
  <g filter="url(#shadow)" transform="translate(400, 260)">
    <!-- Sun -->
    <circle cx="0" cy="-20" r="100" fill="#fef08a" />
    <!-- Mountains / Hills -->
    <path d="M -180,80 Q -90,0 0,60 T 180,40 L 180,120 L -180,120 Z" fill="url(#grad3)" />
    <!-- Mini Heart floating in sky -->
    <path d="M 0,-140 C -15,-160 -35,-150 -35,-130 C -35,-110 0,-85 0,-70 C 0,-85 35,-110 35,-130 C 35,-150 15,-160 0,-140 Z" fill="#f43f5e" opacity="0.9" />
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="#9f1239">Our Best Days 🌅</text>
  <text x="400" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#e11d48" opacity="0.7">Filled with sunset talks and endless laughter.</text>
</svg>
