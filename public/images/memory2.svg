<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fff" />
  <rect x="20" y="20" width="760" height="560" rx="20" fill="url(#grad2)" opacity="0.08" />
  <!-- Sparkly Coffee/Teacup or holding hands abstraction -->
  <g filter="url(#shadow)" transform="translate(400, 260)">
    <circle cx="0" cy="0" r="160" fill="url(#grad2)" />
    <!-- Heart paths floating out -->
    <path d="M -40,-40 C -60,-80 -90,-60 -90,-30 C -90,10 -40,40 -40,60 C -40,40 10,10 10,-30 C 10,-60 -20,-80 -40,-40 Z" fill="#fff" opacity="0.8" transform="scale(0.8) translate(-10, -20)" />
    <path d="M 40,20 C 20,-20 -10,0 -10,30 C -10,70 40,100 40,120 C 40,100 90,70 90,30 C 90,0 60,-20 40,20 Z" fill="#fff" opacity="0.6" transform="scale(0.6) translate(50, -50)" />
    <!-- Sparkles -->
    <path d="M 0,-80 L 10,-95 L 0,-110 L -10,-95 Z" fill="#fbbf24" />
    <path d="M -80,40 L -72,30 L -80,20 L -88,30 Z" fill="#fbbf24" />
    <path d="M 80,-20 L 88,-30 L 80,-40 L 72,-30 Z" fill="#fbbf24" />
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="28" font-weight="600" fill="#4c0519">First Memory ☕</text>
  <text x="400" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#be123c" opacity="0.7">The day that sparked our journey.</text>
</svg>
